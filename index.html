<!DOCTYPE html>
<html>
<head>
  <title>M-Pesa STK Push Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; text-align: center; }
    input { display: block; width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; cursor: pointer; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Test M-Pesa Payment</h2>
  <input id="phone" placeholder="Phone e.g. 254708374149" />
  <input id="amount" placeholder="Amount e.g. 10" />
  <button onclick="pay()">Pay Now</button>
  <p id="status"></p>

  <script>
    async function pay() {
      const phone = document.getElementById("phone").value;
      const amount = document.getElementById("amount").value;
      document.getElementById("status").innerText = "Sending request...";

      const res = await fetch("/.netlify/functions/stkpush", {
        method: "POST",
        body: JSON.stringify({ phone, amount }),
      });
      const data = await res.json();

      if (data.ResponseCode === "0") {
        document.getElementById("status").innerText = "Check your phone for the PIN prompt!";
        pollStatus(data.CheckoutRequestID);
      } else {
        document.getElementById("status").innerText = "Error: " + JSON.stringify(data);
      }
    }

    function pollStatus(checkoutId) {
      const interval = setInterval(async function () {
        const res = await fetch("/.netlify/functions/status?id=" + checkoutId);
        const data = await res.json();

        if (data.status === "paid") {
          document.getElementById("status").innerText = "✅ Payment received!";
          clearInterval(interval);
        } else if (data.status === "failed") {
          document.getElementById("status").innerText = "❌ Payment failed or cancelled.";
          clearInterval(interval);
        }
      }, 3000);
    }
  </script>
</body>
</html>
