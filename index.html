<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M-Pesa STK Push Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00A651;
    --green-dark: #00893F;
    --bg: #F1FBF5;
    --card: #FFFFFF;
    --text: #1F2937;
    --muted: #6B7280;
    --yellow: #FFC145;
    --error: #E14848;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 18px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
  }

  .badge {
    background: var(--yellow);
    color: #6B4A00;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 20px 60px;
    text-align: center;
  }

  h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 32px;
    margin: 0 0 8px;
    max-width: 420px;
  }

  .subhead {
    color: var(--muted);
    font-size: 15px;
    max-width: 360px;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 12px 32px rgba(0, 166, 81, 0.12);
    padding: 32px;
    width: 100%;
    max-width: 360px;
    text-align: left;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #E5E7EB;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    margin-bottom: 18px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-color: var(--green);
  }

  button {
    width: 100%;
    padding: 14px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover {
    background: var(--green-dark);
  }

  button:disabled {
    background: #A7D9BC;
    cursor: not-allowed;
  }

  #status {
    margin-top: 18px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    min-height: 20px;
  }

  #status.success { color: var(--green-dark); }
  #status.error { color: var(--error); }
  #status.pending { color: var(--muted); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 16px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">M</div>
    Pesa Prompt
  </div>
  <div class="badge">Sandbox demo</div>
</header>

<main>
  <h1>Send a payment prompt in seconds</h1>
  <p class="subhead">Enter a phone number and amount — we'll trigger the M-Pesa PIN prompt right on their phone.</p>

  <div class="card">
    <label for="phone">Phone number</label>
    <input id="phone" placeholder="0712345678" />

    <label for="amount">Amount (KES)</label>
    <input id="amount" placeholder="10" />

    <button id="payBtn" onclick="pay()">Send Payment Prompt</button>
    <p id="status"></p>
  </div>
</main>

<footer>Sandbox environment — test transactions only, no real money moves.</footer>

<script>
  async function pay() {
    const phone = document.getElementById("phone").value;
    const amount = document.getElementById("amount").value;
    const btn = document.getElementById("payBtn");
    const status = document.getElementById("status");

    btn.disabled = true;
    status.className = "pending";
    status.innerText = "Sending request...";

    try {
      const res = await fetch("/.netlify/functions/stkpush", {
        method: "POST",
        body: JSON.stringify({ phone, amount }),
      });
      const data = await res.json();

      if (data.ResponseCode === "0") {
        status.className = "success";
        status.innerText = "✅ Check your phone for the PIN prompt!";
      } else {
        status.className = "error";
        status.innerText = "Error: " + JSON.stringify(data);
      }
    } catch (err) {
      status.className = "error";
      status.innerText = "Something went wrong. Try again.";
    }

    btn.disabled = false;
  }
</script>

</body>
</html>
